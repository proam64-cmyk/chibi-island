# Reference GitHub Actions workflow for building the studio APK/AAB in CI.
# Copy to .github/workflows/ at the repository root to use it.
# Required secrets for release builds: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Prompt Studio Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prompt-studio/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci || npm install
      - run: node ../tests/run-node.js
      - run: npm run prepare:web
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Decode keystore
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/upload-keystore.jks
      - name: Release AAB
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-studio-android
          path: |
            prompt-studio/android/android/app/build/outputs/apk/**/*.apk
            prompt-studio/android/android/app/build/outputs/bundle/**/*.aab
